name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: busios-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0812085032
  REGION: us-central1
  SERVICE: busios-ai
  REPOSITORY: busios
  IMAGE: us-central1-docker.pkg.dev/gen-lang-client-0812085032/busios/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build --tag "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --service-account=busios-runtime@gen-lang-client-0812085032.iam.gserviceaccount.com
            --port=8080
            --memory=512Mi
            --cpu=1
            --min=0
            --max=3
            --concurrency=40
            --timeout=900
            --set-env-vars=NODE_ENV=production,PUBLIC_BASE_URL=https://busios-ai-w2pzlhwnxa-uc.a.run.app,GEMINI_MODEL=gemini-2.5-flash,GEMINI_LIVE_MODEL=gemini-3.1-flash-live-preview,GOOGLE_DRIVE_APP_ID=775506581001,ADK_RUNTIME_ENABLED=false,ADK_RUNTIME_FALLBACK_ENABLED=true,ADK_PILOT_AGENTS=MIGUEL:LOLA,ADK_MAX_LATENCY_MS=20000
            --set-secrets=GEMINI_API_KEY=busios-gemini-api-key:latest,TWILIO_ACCOUNT_SID=busios-twilio-account-sid:latest,TWILIO_AUTH_TOKEN=busios-twilio-auth-token:latest,SUPABASE_URL=busios-supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=busios-supabase-service-role-key:latest,APP_ENCRYPTION_KEY=busios-app-encryption-key:latest,GOOGLE_OAUTH_CLIENT_ID=busios-google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=busios-google-oauth-client-secret:latest,GOOGLE_PICKER_API_KEY=busios-google-picker-api-key:latest,KNOWLEDGE_SYNC_SECRET=busios-knowledge-sync-secret:latest,STRIPE_SECRET_KEY=busios-stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=busios-stripe-webhook-secret:latest,STRIPE_PRICE_BASIC_ID=busios-stripe-price-basic:latest,STRIPE_PRICE_GROWTH_ID=busios-stripe-price-growth:latest,STRIPE_PRICE_BUSINESS_ID=busios-stripe-price-business:latest

      - name: Verify health endpoint
        run: curl --fail --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/health"

      - name: Deployment summary
        run: echo "### BusiOS deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
